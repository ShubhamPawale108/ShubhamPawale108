name: Update Profile Art

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch Contributions
        run: python scripts/fetch_contributions.py

      - name: Render Heatmap SVG
        run: python scripts/render_heatmap_svg.py
        
      - name: Generate Neofetch Info Card
        run: python scripts/make_info_card.py
        
      - name: Generate ASCII Profile
        run: |
          python scripts/prep_photo.py || true
          python scripts/make_ascii_svg.py
        
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ assets/
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: refresh profile art [skip ci]" && git push)
