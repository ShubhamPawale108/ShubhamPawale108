<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 176" width="300" height="176">

    <style>
        .ascii {
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            font-weight: bold;
            fill: #c9d1d9;
            white-space: pre;
        }
        .line {
            opacity: 0;
            animation: typeIn 0.1s linear forwards;
